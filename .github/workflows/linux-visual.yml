name: Linux visual inspection

on:
  workflow_dispatch:
    inputs:
      package_run:
        description: Successful Orbit shell package run ID
        required: true

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OrbitShell-linux-installer-x64
          run-id: ${{ inputs.package_run }}
          github-token: ${{ github.token }}
          path: package
      - name: Install the verified package and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ./package/orbit-native-shell_*_amd64.deb xvfb xdotool imagemagick xcompmgr x11-xserver-utils pulseaudio openbox xclip python3-gi gir1.2-gtk-3.0
      - name: Capture the compact island, main panel and preferences
        shell: bash
        run: |
          mkdir -p captures
          xvfb-run -a -s '-screen 0 1280x960x24' bash -euo pipefail <<'EOF'
          export QT_QPA_PLATFORM=xcb GDK_BACKEND=x11
          profile=$(mktemp -d)
          export XDG_CONFIG_HOME="$profile/config" XDG_DATA_HOME="$profile/data" XDG_CACHE_HOME="$profile/cache"
          settings_dir="$XDG_DATA_HOME/OrbitNative/Orbit Native Shell"
          mkdir -p "$settings_dir"
          printf '%s\n' '{"settings":{"collapseOnLeave":false}}' > "$settings_dir/shell.json"
          xsetroot -solid "#263143"
          xcompmgr > captures/compositor.log 2>&1 &
          compositor=$!
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=orbit_visual sink_properties=device.description=Orbit-Visual-Audio
          OrbitShell > captures/app.log 2>&1 &
          app=$!
          trap 'kill "$app" "$compositor" 2>/dev/null || true' EXIT
          wait_window() {
            local title=$1
            for _ in {1..60}; do
              if window=$(xdotool search --onlyvisible --name "$title" | head -n1) && [[ -n "$window" ]]; then
                printf '%s\n' "$window"
                return
              fi
              sleep .25
            done
            return 1
          }
          xdotool mousemove 1 800
          island=$(wait_window '^Orbit Native$')
          sleep 1
          import -window root captures/compact.png
          xdotool mousemove --window "$island" 45 19
          for _ in {1..24}; do
            WIDTH=$(xdotool getwindowgeometry --shell "$island" | awk -F= '/^WIDTH=[0-9]+$/{print $2}')
            WIDTH=${WIDTH:-0}
            if (( WIDTH > 700 )); then break; fi
            sleep .25
          done
          (( WIDTH > 700 ))
          xdotool windowfocus --sync "$island"
          xdotool mousemove --window "$island" 45 19
          sleep 1
          import -window root captures/home-after-1s.png
          sleep 2
          import -window root captures/home-after-3s.png
          sleep 3
          import -window root captures/home-after-6s.png
          capture_tab() {
            local offset=$1 name=$2
            xdotool mousemove --window "$island" 40 39 click 1
            sleep .5
            xdotool mousemove --window "$island" "$offset" 39 click 1
            sleep 2
            import -window root "captures/$name.png"
          }
          capture_tab 344 weather
          capture_tab 393 controls
          capture_tab 441 network
          capture_tab 196 shelf
          xdotool mousemove --window "$island" "$(( WIDTH - 39 ))" 39 click 1
          settings=$(wait_window '^Orbit Native — Settings$')
          sleep 1
          import -window "$settings" captures/settings.png
          identify captures/*.png
          EOF
      - name: Verify the global paste shortcut in a separate GTK editor
        shell: bash
        run: |
          xvfb-run -a bash -euo pipefail <<'EOF'
          export QT_QPA_PLATFORM=xcb GDK_BACKEND=x11
          profile=$(mktemp -d)
          export XDG_CONFIG_HOME="$profile/config" XDG_DATA_HOME="$profile/data" XDG_CACHE_HOME="$profile/cache"
          export ORBIT_PASTE_RESULT="$profile/pasted.txt"
          openbox > captures/window-manager.log 2>&1 &
          wm=$!
          OrbitShell > captures/paste-orbit.log 2>&1 &
          orbit=$!
          /usr/bin/python3 - <<'PY' &
          import os
          import gi
          gi.require_version("Gtk", "3.0")
          from gi.repository import Gtk

          window = Gtk.Window(title="Orbit paste fixture")
          editor = Gtk.TextView()
          window.add(editor)
          window.set_default_size(400, 200)
          def save(buffer):
              with open(os.environ["ORBIT_PASTE_RESULT"], "w", encoding="utf-8") as output:
                  output.write(buffer.get_text(buffer.get_start_iter(), buffer.get_end_iter(), True))
          editor.get_buffer().connect("changed", save)
          window.show_all()
          editor.grab_focus()
          Gtk.main()
          PY
          editor=$!
          trap 'kill "$editor" "$orbit" "$wm" 2>/dev/null || true' EXIT
          timeout 20 xdotool search --sync --onlyvisible --name '^Orbit Native$' >/dev/null
          target=$(timeout 15 xdotool search --sync --onlyvisible --name '^Orbit paste fixture$')
          timeout 10 xdotool windowactivate --sync "$target"
          printf 'Orbit clipboard fixture' | xclip -selection clipboard
          xdotool keydown ctrl keydown alt keydown shift keydown v
          sleep .35
          test ! -s "$ORBIT_PASTE_RESULT"
          xdotool keyup v keyup shift keyup alt keyup ctrl
          for attempt in {1..20}; do
            if [[ -s "$ORBIT_PASTE_RESULT" ]]; then break; fi
            sleep .1
          done
          test "$(cat "$ORBIT_PASTE_RESULT")" = 'Orbit clipboard fixture'
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orbit-linux-visual-inspection
          path: captures
          if-no-files-found: error
