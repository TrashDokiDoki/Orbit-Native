name: System webview preview

on:
  push:
    paths:
      - 'shell/**'
      - 'resources/app/**'
      - 'native/media.*'
      - 'CMakeLists.txt'
      - '.github/workflows/shell.yml'
  pull_request:
    paths:
      - 'shell/**'
      - 'resources/app/**'
      - 'native/media.*'
      - 'CMakeLists.txt'
      - '.github/workflows/shell.yml'

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-qpa-plugins libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DORBIT_WEB_SHELL=ON
      - run: cmake --build build --parallel --target OrbitShell
      - run: xvfb-run -a ctest --test-dir build -R '^shell-ui$' --output-on-failure
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - run: cmake -S . -B build -A x64 -DORBIT_WEB_SHELL=ON
      - run: cmake --build build --config Release --parallel --target OrbitShell
      - run: ctest --test-dir build --build-config Release -R '^shell-ui$' --output-on-failure
      - name: Archive experimental shell for local QA
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path shell-preview | Out-Null
          Copy-Item build/Release/OrbitShell.exe shell-preview/
          Copy-Item build/Release/orbit-shell-ui shell-preview/ -Recurse
          windeployqt --release --no-translations --no-opengl-sw shell-preview/OrbitShell.exe
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitShell-windows-x64
          path: shell-preview/
