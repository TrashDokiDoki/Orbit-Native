name: System webview preview

on:
  push:
    paths:
      - 'shell/**'
      - 'resources/app/**'
      - 'native/media*'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/workflows/shell.yml'
  pull_request:
    paths:
      - 'shell/**'
      - 'resources/app/**'
      - 'native/media*'
      - 'packaging/**'
      - 'CMakeLists.txt'
      - '.github/workflows/shell.yml'

permissions:
  contents: read

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            proxyArch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            proxyArch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-qpa-plugins libgtk-3-dev libwebkit2gtk-4.1-dev libgstreamer1.0-dev libgtk-layer-shell-dev libpulse-dev libxtst-dev xvfb dpkg-dev pulseaudio pulseaudio-utils python3-dbus python3-gi sox gstreamer1.0-tools
      - name: Stage offline dictation for the native architecture
        run: python3 packaging/dictation/build-linux.py ${{ matrix.arch }} speech-bundle
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DORBIT_WEB_SHELL=ON -DORBIT_PACKAGE_SHELL=ON "-DORBIT_DICTATION_BUNDLE=$PWD/speech-bundle"
      - run: cmake --build build --parallel --target OrbitShell
      - name: Start an isolated audio server and test devices
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=orbit_preview_test
          pactl load-module module-null-sink sink_name=orbit_preview_test_second
          pactl set-default-sink orbit_preview_test
      - name: Build a harmless proxy lifecycle fixture
        run: |
          printf '#include <unistd.h>\nint main(void) { for (;;) pause(); }\n' | cc -x c - -o "$RUNNER_TEMP/TgWsProxy_linux_${{ matrix.proxyArch }}"
          echo "ORBIT_TEST_PROXY=$RUNNER_TEMP/TgWsProxy_linux_${{ matrix.proxyArch }}" >> "$GITHUB_ENV"
      - name: Test the app with PulseAudio and an MPRIS player
        run: |
          dbus-run-session -- bash -e -c '
            /usr/bin/python3 shell/tests/mpris_fixture.py "file://$PWD/resources/app/icon.png" &
            fixture=$!
            trap "kill $fixture" EXIT
            ORBIT_TEST_AUDIO=1 ORBIT_TEST_MEDIA=1 ORBIT_TEST_PORTAL=1 xvfb-run -a ctest --test-dir build -R "^shell-ui$" --output-on-failure
          '
      - run: cpack --config build/CPackConfig.cmake -B package
      - name: Install, launch and remove the Debian package
        run: |
          sudo apt-get install -y ./package/orbit-native-shell_*.deb
          desktop=/usr/share/applications/orbit-native-shell.desktop
          grep -Fx 'Name=Orbit Native' "$desktop"
          grep -Fx 'Exec=OrbitShell' "$desktop"
          grep -Fx 'Terminal=false' "$desktop"
          dpkg-query -W xdg-desktop-portal gstreamer1.0-pipewire
          for element in pipewiresrc uritranscodebin webmmux vp8enc pulsesrc opusenc; do
            gst-inspect-1.0 "$element" >/dev/null
          done
          gst-inspect-1.0 pipewiresrc | grep -F 'keepalive-time'
          command -v tesseract
          tesseract --list-langs | grep -x rus
          curl -fsSL https://raw.githubusercontent.com/alphacep/vosk-api/v0.3.45/python/example/test.wav -o "$RUNNER_TEMP/dictation.wav"
          echo "dcfea5712c43a43ba7ae8083afb39d36993e5a69c46e88b68aaa72b65cb615bb  $RUNNER_TEMP/dictation.wav" | sha256sum -c
          sox "$RUNNER_TEMP/dictation.wav" -r 16000 -c 1 -e signed-integer -b 16 -L -t raw "$RUNNER_TEMP/dictation.pcm"
          ORBIT_TEST_AUDIO=1 ORBIT_TEST_DICTATION_PCM="$RUNNER_TEMP/dictation.pcm" xvfb-run -a OrbitShell --smoke-test
      - name: Launch the installed package on Wayland
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get install -y weston
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=orbit-wayland
          unset DISPLAY
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --width=1280 --height=960 --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true; cat "$RUNNER_TEMP/weston.log"' EXIT
          for attempt in {1..40}; do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then break; fi
            sleep .25
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          QT_QPA_PLATFORM=wayland GDK_BACKEND=wayland timeout 60s dbus-run-session -- bash -e -c '
            /usr/bin/python3 shell/tests/mpris_fixture.py "file://$PWD/resources/app/icon.png" &
            fixture=$!
            trap "kill $fixture" EXIT
            ORBIT_TEST_PORTAL=1 OrbitShell --smoke-test
          '
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitShell-linux-installer-${{ matrix.arch }}
          path: package/*.deb
          if-no-files-found: error
      - name: Capture a real Wayland output through the system portal
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get install -y sway xdg-desktop-portal-wlr grim wtype ffmpeg meson ninja-build libpipewire-0.3-dev libwayland-dev wayland-protocols libinih-dev libgbm-dev libdrm-dev libsystemd-dev
          # Ubuntu 24.04's wlr portal cannot negotiate a Pixman screencast on this runner.
          git init "$RUNNER_TEMP/orbit-wlr-source"
          git -C "$RUNNER_TEMP/orbit-wlr-source" fetch --depth 1 https://github.com/emersion/xdg-desktop-portal-wlr.git 34153094662acd713241ca6cbbb20003ef67da5f
          git -C "$RUNNER_TEMP/orbit-wlr-source" checkout --detach FETCH_HEAD
          # The release omits the header declaring close() on Ubuntu 24.04.
          sed -i '1i#include <unistd.h>' "$RUNNER_TEMP/orbit-wlr-source/src/screencast/wlr_screencast.c"
          # Permit the screencopy SHM path when headless Sway has no DMA-BUF global.
          source_file="$RUNNER_TEMP/orbit-wlr-source/src/screencast/wlr_screencast.c"
          grep -Fq '} else if (ctx->screencopy_manager && ctx->linux_dmabuf) {' "$source_file"
          sed -i '/} else if (ctx->screencopy_manager \&\& ctx->linux_dmabuf) {/i\	} else if (ctx->screencopy_manager \&\& !ctx->linux_dmabuf) {\n		logprint(DEBUG, "wayland: using wlr_screencopy with shared memory");' "$source_file"
          grep -Fq 'using wlr_screencopy with shared memory' "$source_file"
          # The SHM array stores format/stride pairs. Do not advertise stride as another format.
          pipewire_source="$RUNNER_TEMP/orbit-wlr-source/src/screencast/pipewire_screencast.c"
          grep -Fq 'xdpw_format_pw_from_drm_fourcc(*format)' "$pipewire_source"
          sed -i '/uint32_t \*format;/{N;/current_constraints.shm_formats/s/uint32_t \*format;/struct xdpw_shm_format *format;/;}' "$pipewire_source"
          sed -i 's/xdpw_format_pw_from_drm_fourcc(\*format)/xdpw_format_pw_from_drm_fourcc(format->fourcc)/' "$pipewire_source"
          meson setup "$RUNNER_TEMP/orbit-wlr-build" "$RUNNER_TEMP/orbit-wlr-source"
          meson compile -C "$RUNNER_TEMP/orbit-wlr-build"
          dbus-run-session -- bash -euo pipefail <<'EOF'
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_CONFIG_HOME="$XDG_RUNTIME_DIR/config"
          export XDG_CURRENT_DESKTOP=sway XDG_SESSION_TYPE=wayland
          export WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_LIBINPUT_NO_DEVICES=1 WLR_HEADLESS_OUTPUTS=1
          mkdir -p "$XDG_CONFIG_HOME/xdg-desktop-portal"
          printf '[preferred]\ndefault=wlr\n' > "$XDG_CONFIG_HOME/xdg-desktop-portal/sway-portals.conf"
          mkdir -p "$XDG_CONFIG_HOME/xdg-desktop-portal-wlr"
          printf '[screencast]\nchooser_type=none\noutput_name=HEADLESS-1\n' > "$XDG_CONFIG_HOME/xdg-desktop-portal-wlr/config"
          printf 'xwayland disable\noutput HEADLESS-1 mode 1280x960\n' > "$XDG_CONFIG_HOME/sway.conf"
          PIPEWIRE_DEBUG=2 pipewire > "$RUNNER_TEMP/orbit-pipewire.log" 2>&1 &
          pipewire_pid=$!
          sway -c "$XDG_CONFIG_HOME/sway.conf" > "$RUNNER_TEMP/orbit-sway.log" 2>&1 &
          compositor=$!
          trap 'kill "$compositor" "$pipewire_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/orbit-sway.log" "$RUNNER_TEMP/orbit-pipewire.log"' EXIT
          for attempt in {1..40}; do
            for socket in "$XDG_RUNTIME_DIR"/wayland-*; do
              if test -S "$socket"; then
                export WAYLAND_DISPLAY="${socket##*/}"
                break 2
              fi
            done
            sleep .25
          done
          test -n "${WAYLAND_DISPLAY:-}"
          for attempt in {1..40}; do
            if test -S "$XDG_RUNTIME_DIR/pipewire-0"; then break; fi
            sleep .25
          done
          test -S "$XDG_RUNTIME_DIR/pipewire-0"
          dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_RUNTIME_DIR XDG_CONFIG_HOME
          wireplumber > "$RUNNER_TEMP/orbit-wireplumber.log" 2>&1 &
          wireplumber_pid=$!
          "$RUNNER_TEMP/orbit-wlr-build/xdg-desktop-portal-wlr" --loglevel DEBUG > "$RUNNER_TEMP/orbit-wlr.log" 2>&1 &
          portal_pid=$!
          trap 'kill "$compositor" "$pipewire_pid" "$wireplumber_pid" "$portal_pid" 2>/dev/null || true; cat "$RUNNER_TEMP"/orbit-{sway,pipewire,wireplumber,wlr}.log' EXIT
          gdbus wait --session --timeout 10 org.freedesktop.impl.portal.desktop.wlr
          export QT_QPA_PLATFORM=wayland GDK_BACKEND=wayland
          ORBIT_TEST_PORTAL=1 ORBIT_TEST_WAYLAND_DESKTOP=1 timeout 60s OrbitShell --smoke-test
          export ORBIT_TEST_RECORD_OUTPUT="$RUNNER_TEMP/orbit-wayland-recording.webm"
          # Record caps negotiation inside WebKit as well as on the PipeWire graph.
          ORBIT_TEST_SOFTWARE_RENDERING=1 GST_DEBUG_NO_COLOR=1 GST_DEBUG='pipewiresrc:6,webkitmediastream:5' \
            timeout 30s OrbitShell --smoke-test > "$RUNNER_TEMP/orbit-record.log" 2>&1 &
          recorder=$!
          for attempt in {1..60}; do
            if grep -q 'record button ready' "$RUNNER_TEMP/orbit-record.log"; then break; fi
            sleep .2
          done
          cat "$RUNNER_TEMP/orbit-record.log"
          grep -q 'record button ready' "$RUNNER_TEMP/orbit-record.log"
          # Follow port changes while the WebKit consumer is still connected.
          timeout 8s pw-dump -m > "$RUNNER_TEMP/orbit-pipewire-state.json" &
          monitor=$!
          export SWAYSOCK=$(find "$XDG_RUNTIME_DIR" -maxdepth 1 -type s -name 'sway-ipc.*.sock' -print -quit)
          test -S "$SWAYSOCK"
          sox -n -r 48000 -c 1 "$RUNNER_TEMP/orbit-test-tone.wav" synth 10 sine 440 vol 0.2
          paplay --device=orbit_preview_test "$RUNNER_TEMP/orbit-test-tone.wav" &
          wtype -s 400 -k Return
          # Change the output itself, including the area outside Orbit's layer surface.
          for color in '#c74141' '#344acf' '#30813b' '#cf8234'; do
            sleep .5
            swaymsg output HEADLESS-1 bg "$color" solid_color >/dev/null
          done
          if ! wait "$recorder"; then
            kill "$monitor" 2>/dev/null || true
            jq -c '[.[] | select(.type == "PipeWire:Interface:Port") | {id, props: (.info.props | with_entries(select(.key | test("^(node.id|port.direction|port.name)$")))), formats: .info.params.EnumFormat}]' "$RUNNER_TEMP/orbit-pipewire-state.json" || true
            tail -n 160 "$RUNNER_TEMP/orbit-record.log"
            exit 1
          fi
          frames=$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$ORBIT_TEST_RECORD_OUTPUT")
          if ! [[ "$frames" =~ ^[0-9]+$ ]] || (( frames < 2 )); then
            echo "Expected at least two decoded video frames, got: $frames" >&2
            exit 1
          fi
          ffmpeg -hide_banner -i "$ORBIT_TEST_RECORD_OUTPUT" -map 0:a:0 -af volumedetect -f null - 2> "$RUNNER_TEMP/orbit-audio-check.log"
          cat "$RUNNER_TEMP/orbit-audio-check.log"
          awk '/max_volume:/ { if ($(NF-1) + 0 > -35) audible=1 } END { exit !audible }' "$RUNNER_TEMP/orbit-audio-check.log"
          printf 'Decoded Wayland recording: %s video frames and an audible system audio track\n' "$frames"
          EOF
      - name: Keep the verified Wayland recording
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: OrbitShell-wayland-recording
          path: ${{ runner.temp }}/orbit-wayland-recording.webm
          if-no-files-found: error
      - name: Remove the Debian package
        if: success() || failure()
        run: |
          sudo apt-get remove -y orbit-native-shell
          test ! -e /usr/bin/OrbitShell
  windows:
    name: windows-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            generatorArch: x64
            qtArch: win64_msvc2022_64
          - runner: windows-11-arm
            arch: arm64
            generatorArch: ARM64
            qtArch: win64_msvc2022_arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qtArch }}
      - name: Install NSIS
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -eq 0) {
              $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
              if (Test-Path -LiteralPath $compiler) { exit 0 }
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          throw 'Could not install the NSIS compiler'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/orbit-vcpkg-cache
          key: windows-${{ matrix.arch }}-ocr-${{ hashFiles('packaging/ocr/vcpkg.json') }}
      - name: Build the bundled OCR runtime
        timeout-minutes: 35
        shell: pwsh
        run: ./packaging/ocr/build-windows.ps1 -Architecture ${{ matrix.arch }} -Output orbit-ocr
      - name: Get signed Microsoft WebView2 bootstrapper
        shell: pwsh
        run: |
          curl.exe --fail --location --silent --show-error --output WebView2Setup.exe 'https://go.microsoft.com/fwlink/p/?LinkId=2124703'
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 download failed' }
          $signature = Get-AuthenticodeSignature -LiteralPath WebView2Setup.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
            throw 'The Microsoft WebView2 bootstrapper signature could not be verified'
          }
      - run: cmake -S . -B build -A ${{ matrix.generatorArch }} -DORBIT_WEB_SHELL=ON -DORBIT_PACKAGE_SHELL=ON "-DORBIT_WEBVIEW2_BOOTSTRAPPER=$((Resolve-Path WebView2Setup.exe).Path -replace '\\','/')" "-DORBIT_TESSERACT_BUNDLE=${{ github.workspace }}/orbit-ocr"
      - run: cmake --build build --config Release --parallel --target OrbitShell
      - run: ctest --test-dir build --build-config Release -R '^shell-ui$' --output-on-failure
      - name: Report crash details
        if: failure()
        shell: pwsh
        run: |
          $crash = Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Where-Object Message -Like '*OrbitShell.exe*' | Select-Object -First 1 -ExpandProperty Message
          if (!$crash) { return }
          $crash
          if ($crash -match 'Fault offset: 0x([a-f0-9]+)' -and (Test-Path build/OrbitShell-Release.map)) {
            $offset = [Convert]::ToUInt64($Matches[1], 16)
            $map = Get-Content build/OrbitShell-Release.map
            $baseLine = $map | Select-String 'Preferred load address is ([a-f0-9]+)' | Select-Object -First 1
            if ($baseLine) {
              $address = [Convert]::ToUInt64($baseLine.Matches[0].Groups[1].Value, 16) + $offset
              $closest = $map | ForEach-Object {
                if ($_ -match '^\s*[a-f0-9]+:[a-f0-9]+\s+(\S+)\s+([a-f0-9]{12,16})\s+') {
                  $symbol = [Convert]::ToUInt64($Matches[2], 16)
                  if ($symbol -le $address) { [pscustomobject] @{Address=$symbol; Name=$Matches[1]} }
                }
              } | Sort-Object Address -Descending | Select-Object -First 1
              if ($closest) { "Fault is near $($closest.Name) at +$($address - $closest.Address)" }
            }
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          cpack --config build/CPackConfig.cmake -C Release -B package
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem -Path package -Filter NSISOutput.log -Recurse | ForEach-Object { Get-Content $_.FullName -Tail 45 }
            throw 'CPack could not build the Windows installer'
          }
      - name: Install, launch and remove the Windows package
        shell: pwsh
        run: |
          $installer = Get-Item package/OrbitShell-*-windows-${{ matrix.arch }}.exe
          $dest = Join-Path $env:RUNNER_TEMP 'OrbitShell-test'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$dest") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exit code $($setup.ExitCode)" }
          $exe = Join-Path $dest 'bin/OrbitShell.exe'
          $ocr = Join-Path $dest 'bin/orbit-ocr/tesseract.exe'
          $languages = & $ocr --tessdata-dir (Join-Path $dest 'bin/orbit-ocr/tessdata') --list-langs
          if ($LASTEXITCODE -ne 0 -or $languages -notcontains 'rus' -or $languages -notcontains 'eng') {
            throw 'Bundled Russian and English OCR could not start'
          }
          $test = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (!$test.WaitForExit(30000)) { Stop-Process -Id $test.Id; throw 'Smoke test timed out' }
          if ($test.ExitCode -ne 0) { throw "Smoke test exit code $($test.ExitCode)" }
          $remove = Start-Process -FilePath (Join-Path $dest 'Uninstall.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitShell-windows-installer-${{ matrix.arch }}
          path: package/OrbitShell-*-windows-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Stage the native Windows payload for the combined installer
        shell: pwsh
        run: cmake --install build --config Release --prefix "$(Join-Path (Get-Location) windows-payload)"
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitShell-windows-payload-${{ matrix.arch }}
          path: windows-payload/
          if-no-files-found: error

  windows-universal:
    name: windows-universal
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OrbitShell-windows-payload-x64
          path: payload/x64
      - uses: actions/download-artifact@v4
        with:
          name: OrbitShell-windows-payload-arm64
          path: payload/arm64
      - name: Install NSIS
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -eq 0) {
              $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
              if (Test-Path -LiteralPath $compiler) { exit 0 }
            }
            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }
          throw 'Could not install the NSIS compiler'
      - name: Build one per-user Windows installer
        shell: pwsh
        run: |
          $workspace = (Get-Location).Path
          $bootstrap = Join-Path $workspace 'WebView2Setup.exe'
          curl.exe --fail --location --silent --show-error --output $bootstrap 'https://go.microsoft.com/fwlink/p/?LinkId=2124703'
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 download failed' }
          $signature = Get-AuthenticodeSignature -LiteralPath $bootstrap
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Microsoft Corporation') {
            throw 'The Microsoft WebView2 bootstrapper signature could not be verified'
          }
          $pattern = '(?m)^project[(]OrbitNative VERSION ([0-9.]+)'
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw), $pattern).Groups[1].Value
          if (!$version) { throw 'Could not determine the Orbit version' }
          $compiler = Get-Command makensis.exe -ErrorAction SilentlyContinue
          $makensis = if ($compiler) { $compiler.Source } else { Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe' }
          New-Item -ItemType Directory -Path output -Force | Out-Null
          & $makensis /V2 /INPUTCHARSET UTF8 "/DORBIT_VERSION=$version" "/DORBIT_BOOTSTRAPPER=$bootstrap" `
            "/DORBIT_X64=$workspace/payload/x64" "/DORBIT_ARM64=$workspace/payload/arm64" `
            "/DORBIT_OUTPUT=$workspace/output/OrbitNative-$version-Windows.exe" packaging/orbit-native-windows.nsi
          if ($LASTEXITCODE -ne 0) { throw 'NSIS could not build the combined installer' }
      - uses: actions/upload-artifact@v4
        with:
          name: OrbitShell-windows-installer-universal
          path: output/*.exe
          if-no-files-found: error

  windows-universal-smoke:
    name: windows-universal-test-${{ matrix.arch }}
    needs: windows-universal
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            machine: 34404
          - runner: windows-11-arm
            arch: arm64
            machine: 43620
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OrbitShell-windows-installer-universal
      - name: Verify installation, native architecture, launch and removal
        shell: pwsh
        run: |
          $installer = Get-Item OrbitNative-*-Windows.exe
          $dest = Join-Path $env:RUNNER_TEMP 'OrbitUniversalSmoke'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$dest") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer exit code $($setup.ExitCode)" }
          $exe = Join-Path $dest 'orbit-app/bin/OrbitShell.exe'
          $pe = [IO.File]::ReadAllBytes($exe)
          $header = [BitConverter]::ToInt32($pe, 0x3c)
          $machine = [BitConverter]::ToUInt16($pe, $header + 4)
          if ($machine -ne ${{ matrix.machine }}) { throw "Unexpected installed PE architecture $machine" }
          $test = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (!$test.WaitForExit(30000)) { Stop-Process -Id $test.Id; throw 'Smoke test timed out' }
          if ($test.ExitCode -ne 0) { throw "Smoke test exit code $($test.ExitCode)" }
          if ('${{ matrix.arch }}' -eq 'x64') {
            pwsh -NoProfile -Sta -File shell/tests/windows-plain-paste.ps1 -Executable $exe
            if ($LASTEXITCODE -ne 0) { throw 'Plain-text paste test failed' }
          }
          $remove = Start-Process -FilePath (Join-Path $dest 'Uninstall.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path $exe)) { throw 'Uninstall failed' }
